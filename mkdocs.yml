site_name: Architect Study Hub
site_description: Base de conocimiento de teoría y práctica para arquitectura e ingeniería de software, plataforma y cloud.
site_author: ferre
# En GitHub Actions se rellenan con la URL de GitHub Pages y del repositorio; en local, valores por defecto
site_url: !ENV [SITE_URL, "http://127.0.0.1:8000/"]
repo_url: !ENV REPO_URL

validation:
  anchors: warn
  unrecognized_links: warn
copyright: "Material de estudio personal · Creado con ayuda de inteligencia artificial (Claude): puede contener errores, contrasta los datos importantes con las fuentes oficiales"

theme:
  name: material
  language: es
  icon:
    logo: material/sitemap-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search:
      lang: es

extra_css:
  - assets/extra.css
  - assets/chat.css

extra_javascript:
  - assets/ejercicios.js
  - https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js
  - https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js
  - assets/chat.js

hooks:
  - hooks/ejercicios.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

