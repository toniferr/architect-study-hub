      - "Caso: Acortador de URLs": system-design/url-shortener.md
      - "Caso: Almacén clave-valor": system-design/key-value-store.md
      - "Caso: Notificaciones": system-design/notificaciones.md
      - "Caso: Chat": system-design/chat.md
      - "Caso: Web crawler": system-design/web-crawler.md
      - "Caso: News feed": system-design/news-feed.md
      - "Caso: Autocompletado": system-design/autocompletado.md
      - "Caso: Plataforma de vídeo": system-design/video.md
